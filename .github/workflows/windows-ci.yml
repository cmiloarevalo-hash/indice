name: Windows CI

on:
  push:
    branches:
      - work-item-4-t2-project-skeleton
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore BibliotecaDesktop.sln

      - name: Build
        run: dotnet build BibliotecaDesktop.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test BibliotecaDesktop.sln --configuration Release --no-build --no-restore
